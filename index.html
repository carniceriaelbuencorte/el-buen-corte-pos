<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carnicería El Buen Corte</title>
  <style>
    body { background-color: #0b0b0b; color: #f3f4f6; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #141414; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 400px; }
    h2 { color: #d4af37; margin-bottom: 24px; }
    button { width: 100%; padding: 16px; margin: 10px 0; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:hover { background: #262626; border-color: #d4af37; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Carnicería El Buen Corte</h2>
    <button onclick="alert('Sistema de Caja Iniciado')">CAJERO</button>
    <button onclick="alert('Panel de Administrador Iniciado')">ADMINISTRADOR</button>
  </div>
</body>
</html>
