<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carnicería El Buen Corte - POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b0b0b; color: #f3f4f6; min-height: 100vh; padding: 24px; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; }
    .btn-gold { background: #d4af37; color: #000; padding: 12px 20px; }
    .btn-red { background: #8b181b; color: #fff; padding: 10px 18px; }
    .btn-green { background: #22c55e; color: #000; padding: 14px 20px; font-size: 1.15rem; width: 100%; margin-top: 15px; font-weight: bold; }
    .btn-gray { background: #262626; color: #fff; padding: 12px 20px; border: 1px solid #383838; }
    .caja-input { width: 100%; padding: 14px; background: #141414; border: 1px solid #d4af37; color: #fff; font-size: 1.05rem; text-align: center; border-radius: 8px; margin: 12px 0; outline: none; }
    .tabla { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .tabla th { padding: 12px 10px; border-bottom: 1px solid #2a2a2a; text-align: left; color: #9ca3af; font-size: 0.85rem; text-transform: uppercase; }
    .tabla td { padding: 14px 10px; border-bottom: 1px solid #1c1c1c; font-size: 0.95rem; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="vista-login" style="max-width: 440px; margin: 40px auto; text-align: center; background: #141414; padding: 32px 24px; border-radius: 12px; border: 1px solid #262626;">
    <h2 style="color: #d4af37; margin-bottom: 20px; font-size: 1.5rem;">Carnicería El Buen Corte</h2>

    <div id="opciones-rol" style="display: flex; gap: 14px;">
      <button onclick="seleccionarRol('cajero')" style="flex: 1; padding: 22px 12px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 10px; cursor: pointer;">
        <span style="font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 6px;">CAJERO</span>
        <span style="font-size: 0.75rem; color: #d4af37;">Punto de Venta</span>
      </button>
      <button onclick="seleccionarRol('admin')" style="flex: 1; padding: 22px 12px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 10px; cursor: pointer;">
        <span style="font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 6px;">ADMINISTRADOR</span>
        <span style="font-size: 0.75rem; color: #d4af37;">Supervisión</span>
      </button>
    </div>

    <div id="cuadro-clave" style="display: none; margin-top: 24px;">
      <h3 id="titulo-clave" style="margin-bottom: 8px; font-size: 1rem; color: #ddd; font-weight: 500;"></h3>
      <input type="password" id="input-clave" class="caja-input" />
      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button onclick="volver()" class="btn-gray" style="flex: 1;">Volver</button>
        <button onclick="entrar()" class="btn-gold" style="flex: 1;">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- CAJERO -->
  <div id="vista-cajero" style="display: none; max-width: 1000px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 16px; margin-bottom: 24px;">
      <h2 style="font-size: 1.4rem;">Terminal de Caja 1</h2>
      <button onclick="salir()" class="btn-red">Salir</button>
    </div>
    <div style="background: #141414; padding: 24px; border-radius: 10px; border: 1px solid #222; text-align: center;">
      <h3 style="color: #22c55e; font-size: 1.5rem; margin-bottom: 10px;">¡Caja Abierta con Éxito!</h3>
      <p style="color: #aaa;">El sistema operativo de venta está listo para recibir códigos de balanza.</p>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="vista-admin" style="display: none; max-width: 1000px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 16px; margin-bottom: 24px;">
      <h2 style="font-size: 1.4rem;">Panel de Administración Gerencial</h2>
      <button onclick="salir()" class="btn-red">Salir</button>
    </div>
    <div style="background: #141414; padding: 24px; border-radius: 10px; border: 1px solid #222; text-align: center;">
      <h3 style="color: #d4af37; font-size: 1.5rem; margin-bottom: 10px;">¡Panel de Admin Activo!</h3>
      <p style="color: #aaa;">Supervisión y control gerencial habilitados.</p>
    </div>
  </div>

  <script>
    var rolActual = '';

    function seleccionarRol(rol) {
      rolActual = rol;
      document.getElementById('opciones-rol').style.display = 'none';
      document.getElementById('cuadro-clave').style.display = 'block';
      document.getElementById('input-clave').value = '';
      
      if (rol === 'cajero') {
        document.getElementById('titulo-clave').innerText = 'Ingrese PIN de Caja (1810):';
      } else {
        document.getElementById('titulo-clave').innerText = 'Ingrese Contraseña de Admin:';
      }
      document.getElementById('input-clave').focus();
    }

    function volver() {
      document.getElementById('cuadro-clave').style.display = 'none';
      document.getElementById('opciones-rol').style.display = 'flex';
      rolActual = '';
    }

    function entrar() {
      var pass = document.getElementById('input-clave').value.trim();
      if (rolActual === 'cajero' && pass === '1810') {
        document.getElementById('vista-login').style.display = 'none';
        document.getElementById('vista-cajero').style.display = 'block';
      } else if (rolActual === 'admin' && pass === 'newyorksteak') {
        document.getElementById('vista-login').style.display = 'none';
        document.getElementById('vista-admin').style.display = 'block';
      } else {
        alert('Clave incorrecta');
      }
    }

    function salir() {
      document.getElementById('vista-cajero').style.display = 'none';
      document.getElementById('vista-admin').style.display = 'none';
      volver();
      document.getElementById('vista-login').style.display = 'block';
    }
  </script>
</body>
</html>
